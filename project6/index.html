<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Інтернет-магазин</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Tech Store</h1>
    </header>

    <nav class="menu">
        <a href="#">Головна</a>
        <a href="#">Товари</a>
        <a href="#">Контакти</a>
    </nav>

    <main>

        <div class="static-box">Перший блок</div>
        <div class="static-box" style="top: 50px;">Другий блок</div>
        <div class="static-box">Третій блок</div>


        <div class="relative-box">Цей блок зміщений</div>

        <div class="product">
            <span class="discount">-20%</span>
            <h2>Ноутбук</h2>
            <p>Ноутбук для навчання та роботи.</p>
            <p>25 000 грн</p>
        </div>

        <div class="product">
            <span class="discount">-15%</span>
            <h2>Смартфон</h2>
            <p>Потужний смартфон з якісною камерою.</p>
            <p>15 000 грн</p>
        </div>

        <div class="product">
            <span class="discount">-10%</span>
            <h2>Навушники</h2>
            <p>Навушники для музики та дзвінків.</p>
            <p>3 500 грн</p>
        </div>

        <div class="banner">
            <img src="image.jpg" alt="Реклама">
            <button class="banner-button">Детальніше</button>
        </div>

        <div class="layers">
            <div class="box1">Блок 1</div>
            <div class="box2">Блок 2</div>
        </div>
    </main>

    <button class="help">Допомога</button>

</body>
</html>
