<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Tech Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Tech Store</h1>
        <nav class="menu">
            <a href="#">Головна</a>
            <a href="#">Товари</a>
            <a href="#">Контакти</a>
        </nav>
    </header>

    <main>
        <h2>Популярні товари</h2>
        <div class="products">
            <div class="card">
                <h3>Ноутбук</h3>
                <p>Швидкий ноутбук.</p>
                <div class="card-bottom">
                    <span>25 000 грн</span>
                    <button>Купити</button>
                </div>
            </div>

            <div class="card">
                <h3>Смартфон</h3>
                <p>Сучасний телефон.</p>
                <div class="card-bottom">
                    <span>18 500 грн</span>
                    <button>Купити</button>
                </div>
            </div>

            <div class="card">
                <h3>Навушники</h3>
                <p>Бездротові навушники.</p>
                <div class="card-bottom">
                    <span>4 200 грн</span>
                    <button>Купити</button>
                </div>
            </div>

            <div class="card">
                <h3>Монітор</h3>
                <p>Яскравий екран.</p>
                <div class="card-bottom">
                    <span>9 800 грн</span>
                    <button>Купити</button>
                </div>
            </div>

            <div class="card">
                <h3>Клавіатура</h3>
                <p>Механічна клавіатура.</p>
                <div class="card-bottom">
                    <span>3 100 грн</span>
                    <button>Купити</button>
                </div>
            </div>

            <div class="card">
                <h3>Мишка</h3>
                <p>Ігрова мишка.</p>
                <div class="card-bottom">
                    <span>1 500 грн</span>
                    <button>Купити</button>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
