<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Практична робота - Таблиці в HTML</title>
</head>
<body>
    <table border="1" >
        <caption><h3>Розклад занять</h3></caption>  
        
        <thead>
            <tr>
                <th rowspan="2">День тижня</th>
                <th rowspan="2">№ пари</th>
                <th rowspan="2">Час</th>
                <th colspan="2">Інформація про заняття</th>
            </tr>
            <tr>
                <th>Предмет</th>
                <th>Кабінет</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td rowspan="3">Понеділок</td>
                <td>1</td>
                <td>08:30 - 09:50</td>
                <td>Математика</td>
                <td>101</td>
            </tr>
            <tr>
                <td>2</td>
                <td>10:05 - 11:25</td>
                <td>Фізика</td>
                <td>102</td>
            </tr>
            <tr>
                <td>3</td>
                <td>11:40 -  13:00</td>
                <td>Інформатика</td>
                <td>205</td>
            </tr>
            <tr>
                <td rowspan="2">Вівторок</td>
                <td>1</td>
                <td>08:30 - 09:50</td>
                <td>Історія</td>
                <td>301</td>
            </tr>
            <tr>
                <td>2</td>
                <td>10:05 - 11:25</td>
                <td>Англійська мова</td>
                <td>202</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                
                <td colspan="5">Всього занять: 5</td>
            </tr>
        </tfoot>
    </table>

</body>
</html>
