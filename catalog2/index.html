<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог товарів</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <h1 class="header__title">Наш каталог товарів</h1>
    </header>

    <main class="main">
        <section class="catalog">
            
            <div class="card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQKY13fQVSQRijWKYbPU0n0X8ii7VLe2-4FxWt5F8Z-8Q&s=10" alt="Товар 1" class="card__image">
                <div class="card__content">
                    <h2 class="card__title">iPHONE 18 Pro</h2>
                    <p class="card__description">Смартфон нового покоління</p>
                    <span class="card__price">79 999 грн</span>
                    <button class="button">Купити</button>
                </div>
            </div>

            <div class="card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSqnr8Y7No9XtaJEhnr_UQbTrTk9yAua4FW5OBa_lTgJg&s=10" alt="Товар 2" class="card__image">
                <div class="card__content">
                    <h2 class="card__title">AIRPODS</h2>
                    <p class="card__description">найкращі бездротові навушники</p>
                    <span class="card__price">5 499 грн</span>
                    <button class="button">Купити</button>
                </div>
            </div>

            <div class="card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSflpq-2nsY5opW7GjjMYQcvobtSJgFZYAiXhILtpS7kw&s=10" alt="Товар 3" class="card__image">
                <div class="card__content">
                    <h2 class="card__title">APPLE WATCH</h2>
                    <p class="card__description">Найкрасивіший годинник.</p>
                    <span class="card__price">5 200 грн</span>
                    <button class="button">Купити</button>
                </div>
            </div>
        </section>
    </main>

</body>
</html>
