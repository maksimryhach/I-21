<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Курс</title>
</head>
<body>
    <header>
        <h1>Курс</h1>
        <nav>

                <li><a href="index.html">Головна</a></li>

    <!--
    Виправлені проблеми веб-доступності:
    1. Виправлено структуру заголовків: використано <h1> для головного заголовка сторінки та <h2> для підзаголовків розділів замість <h2> та <h4>.
    2. Додано семантичні теги <header>, <nav>, <main> та <section> для створення чіткої структури сторінки.
    3. Замінено неінформативні тексти посилань Тут Натиснути тут на зрозумілі Уроки Контакти.
    4. Додано атрибут alt зі змістовним описом для зображення <img>.

    -->

</html>
