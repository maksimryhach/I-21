
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог товарів</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Магазин товарів</h1>
        <p>Наш каталог продукції</p>
    </header>

    <h2>Популярні товари</h2>

    <div class="catalog">

        <div class="card">
            <h3>Телефон</h3>
            <p>Сучасний смартфон із гарною камерою.</p>
            <h4>10000 грн</h4>
            <button>Купити</button>
        </div>

        <div class="card">
            <h3>Ноутбук </h3>
            <p>Зручний ноутбук для роботи та навчання.</p>
            <h4>20000 грн</h4>
            <button>Купити</button>
        </div>

        <div class="card">
            <h3>Навушники </h3>
            <p>Якісні бездротові навушники.</p>
            <h4>1500 грн</h4>
            <button>Купити</button>
        </div>

    </div>

    <footer>
        <p>2026 Магазин товарів</p>
    </footer>

</body>
</html>
