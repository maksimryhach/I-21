<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechStore — Адаптивний інтернет-магазин</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="container header-content">
            <div class="logo">TechStore</div>
            <nav class="nav">
                <ul class="nav-list">
                    <li><a href="#">Головна</a></li>
                    <li><a href="#">Каталог</a></li>
                    <li><a href="#">Акції</a></li>
                    <li><a href="#">Контакти</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <h1 class="page-title">Популярні товари</h1>

        <section class="products-grid">

            <article class="product-card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQnvRYrFwytfeGjNQdnV_YadbRC69EfQtnX9WnnnJCyeA&s=10">
                <h2 class="product-title">Ноутбук</h2>
                <p class="product-price">32 500 грн</p>
                <button class="buy-btn">Купити</button>
            </article>

            <article class="product-card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRVBmasbXPD4SVPVtNFqSDPjrJKoypoTjx0VHCCZ2fVpA&s">
                <h2 class="product-title">Смартфон</h2>
                <p class="product-price">18 999 грн</p>
                <button class="buy-btn">Купити</button>
            </article>


            <article class="product-card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSoGrUOHws4n6eYns-1OHwLOzUNtkWl3JaU3bdYWDeZKA&s">
                <h2 class="product-title">навушники </h2>
                <p class="product-price">4 200 грн</p>
                <button class="buy-btn">Купити</button>
            </article>


            <article class="product-card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSiu5DakU3Pw13Urb--71gn_lZWXJa34DxzSeF-SBza8w&s=10"">
                <h2 class="product-title">Смарт годинник</h2>
                <p class="product-price">7 800 грн</p>
                <button class="buy-btn">Купити</button>
            </article>

            <article class="product-card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRdI1amlmZdfStYLPCi0W-lxygbQTwG9wNZbBLneyQLUw&s=10">
                <h2 class="product-title">Планшет"</h2>
                <p class="product-price">14 500 грн</p>
                <button class="buy-btn">Купити</button>
            </article>

            <article class="product-card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT6eTac4APbawA4GpGvqZGhtyTz2gTO4QdKplQ6c0hJzw&s=10" >
                <h2 class="product-title">Механічна клавіатура RGB</h2>
                <p class="product-price">3 100 грн</p>
                <button class="buy-btn">Купити</button>
            </article>
        </section>
    </main>

</body>
</html>
